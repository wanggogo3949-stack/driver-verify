<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息核验</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#f4f5f7;padding:20px}
.card{max-width:420px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px #00000014}
.title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:20px;color:#222}
.img-wrap{width:100%;border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:20px}
.img-wrap img{width:100%;display:block}
.info-line{margin:10px 0;font-size:15px;color:#333}
.code{font-family:monospace;font-size:22px;letter-spacing:3px;color:#111;margin:12px 0}
.footer{margin-top:24px;text-align:center;font-size:13px;color:#777}
</style>
</head>
<body>
<div class="card">
  <div class="title">信息核验</div>
  <div class="img-wrap">
    <img src="photo.jpg" alt="核验照片">
  </div>
  <div class="info-line">核验编号：</div>
  <div class="code">110311098888</div>
  <div class="info-line">核验状态：✅ 已核验</div>
  <div class="footer">扫码核验 · 仅供核验使用</div>
</div>
</body>
</html>
